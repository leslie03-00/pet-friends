<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>我的电子小宠物</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0b0e1a;color:#e8eeff;
    display:flex;justify-content:center;align-items:stretch;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  .app{
    position:relative;width:100%;max-width:480px;height:100dvh;height:100vh;
    display:flex;flex-direction:column;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    gap:10px;
    background:radial-gradient(130% 70% at 50% -10%,#2c3e6b 0%,#1a2140 42%,#0d1020 100%);
  }
  @media (min-width:600px){
    body{align-items:center;background:#080a12}
    .app{height:min(860px,94dvh);border-radius:30px;overflow:hidden;
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.02) inset;}
  }

  /* ---------- 顶部 ---------- */
  .header{display:flex;align-items:center;gap:9px;padding:2px 4px;flex:none}
  .avatar{
    width:9px;height:9px;border-radius:50%;
    background:#6ee7b7;box-shadow:0 0 10px #6ee7b7;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .pet-name{font-size:17px;font-weight:600;letter-spacing:.4px}
  .pet-info{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:#93a1c4}
  .age-badge{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;font-weight:600}
  .mood-tag{
    font-size:11px;padding:3px 10px;border-radius:999px;
    background:rgba(125,211,252,.14);color:#7dd3fc;
    border:1px solid rgba(125,211,252,.28);
    transition:all .35s;
  }
  .mood-tag.warn{background:rgba(255,180,84,.14);color:#ffb454;border-color:rgba(255,180,84,.3)}
  .mood-tag.bad{background:rgba(255,95,109,.15);color:#ff8b96;border-color:rgba(255,95,109,.3)}

  /* ---------- 舞台 ---------- */
  .stage{position:relative;flex:1;min-height:0}
  #pet{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

  .toast{
    position:absolute;left:50%;top:14%;
    transform:translate(-50%,-8px);
    padding:7px 15px;border-radius:999px;font-size:13px;
    background:rgba(18,26,48,.9);border:1px solid rgba(255,255,255,.15);
    color:#dbe6ff;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .25s,transform .25s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:5;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 底部面板 ---------- */
  .panel{
    flex:none;display:flex;flex-direction:column;gap:13px;
    padding:14px;border-radius:22px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}
  .stat{display:flex;align-items:center;gap:7px}
  .stat .ico{font-size:14px;width:17px;text-align:center;flex:none;line-height:1}
  .track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1),background .4s}
  .stat .val{width:24px;text-align:right;font-size:11px;color:#93a1c4;font-variant-numeric:tabular-nums;flex:none}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .act{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:11px 4px;border-radius:16px;font-family:inherit;font-size:12px;
    color:#e8eeff;cursor:pointer;border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    transition:transform .12s,background .2s,box-shadow .2s;
  }
  .act:active{transform:scale(.93);background:rgba(255,255,255,.18)}
  .act .emoji{font-size:20px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}

  /* ---------- 选择界面 & 互动菜单弹窗 ---------- */
  .overlay {
    position: absolute; inset: 0; background: rgba(13,16,32,0.95); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; transition: opacity 0.5s ease, visibility 0.5s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .overlay h1 {
    font-size: 24px; margin-bottom: 8px;
    background: linear-gradient(90deg, #6ee7b7, #7dd3fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .overlay p { font-size: 13px; color: #93a1c4; margin-bottom: 24px; }
  
  .pet-options {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; width: 100%; max-width: 360px; margin-bottom: 24px;
  }
  .pet-card {
    background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.1);
    border-radius: 18px; padding: 16px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; cursor: pointer; transition: all 0.25s;
  }
  .pet-card.active { border-color: #6ee7b7; background: rgba(110,231,183,.15); box-shadow: 0 0 20px rgba(110,231,183,.2); transform: translateY(-4px); }
  .pet-card .emoji-icon { font-size: 36px; }
  .pet-card .pet-label { font-size: 13px; font-weight: 500; }
  
  .name-input {
    width: 100%; max-width: 360px; padding: 14px 18px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.3);
    color: #fff; font-size: 15px; font-family: inherit; outline: none;
    text-align: center; margin-bottom: 20px; transition: border-color 0.3s;
  }
  .name-input:focus { border-color: #6ee7b7; }
  
  .start-btn {
    width: 100%; max-width: 360px; padding: 15px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, #6ee7b7, #3b82f6); color: #fff;
    font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: transform 0.15s, opacity 0.3s; opacity: 0.5; pointer-events: none;
  }
  .start-btn.ready { opacity: 1; pointer-events: auto; }
  .start-btn.ready:active { transform: scale(0.96); }

  /* 互动菜单弹窗（底部的选择器） */
  .action-menu {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(18,26,48,0.95); border-top: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(20px); border-radius: 24px 24px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom,0px));
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .action-menu.show { transform: translateY(0); }
  .action-menu h3 { font-size: 15px; margin: 0 0 15px 0; color: #e8eeff; text-align: center; }
  .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .menu-item {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px; padding: 12px 4px; display: flex; flex-direction: column;
    align-items: center; gap: 6px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .menu-item:active { transform: scale(0.92); background: rgba(255,255,255,.15); }
  .menu-item .item-emoji { font-size: 24px; }
  .menu-item .item-label { font-size: 11px; color: #93a1c4; }
  .menu-close {
    margin-top: 15px; width: 100%; padding: 12px; border-radius: 14px;
    background: rgba(255,255,255,.05); border: none; color: #93a1c4;
    font-size: 14px; font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <!-- 选择宠物遮罩层 -->
  <div class="overlay" id="startScreen">
    <h1>领养你的小伙伴</h1>
    <p>选择一只喜欢的宠物，给它取个名字吧</p>
    <div class="pet-options" id="petOptions">
      <div class="pet-card" data-type="cat"><span class="emoji-icon">🐱</span><span class="pet-label">小猫</span></div>
      <div class="pet-card" data-type="dog"><span class="emoji-icon">🐶</span><span class="pet-label">小狗</span></div>
      <div class="pet-card" data-type="pig"><span class="emoji-icon">🐷</span><span class="pet-label">小猪</span></div>
    </div>
    <input type="text" id="petNameInput" class="name-input" placeholder="给它取个名字..." maxlength="8" autocomplete="off">
    <button class="start-btn" id="startBtn">开始陪伴</button>
  </div>

  <!-- 顶部信息栏 -->
  <div class="header">
    <span class="avatar"></span>
    <span class="pet-name" id="headerName">小糯米</span>
    <div class="pet-info">
      <span class="age-badge" id="ageDisplay">0 岁</span>
      <span class="mood-tag" id="moodTag">开心</span>
    </div>
  </div>

  <!-- 画布舞台 -->
  <div class="stage">
    <canvas id="pet"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <!-- 底部操作栏 -->
  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="act" data-act="feed"><span class="emoji">🍎</span>喂食</button>
      <button class="act" data-act="play"><span class="emoji">🎾</span>玩耍</button>
      <button class="act" data-act="clean"><span class="emoji">🛁</span>洗澡</button>
      <button class="act" data-act="sleep"><span class="emoji">💤</span>睡觉</button>
    </div>
  </div>

  <!-- 互动菜单弹窗（食物/洗澡选择器） -->
  <div class="action-menu" id="actionMenu">
    <h3 id="menuTitle">选择食物</h3>
    <div class="menu-grid" id="menuGrid">
      <!-- JS 动态填充 -->
    </div>
    <button class="menu-close" id="menuClose">取消</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const clamp = (v, a = 0, b = 100) => (v < a ? a : v > b ? b : v);
  const rand  = (a, b) => a + Math.random() * (b - a);

  /* =========================================================
     存档 / 状态
  ========================================================= */
  const SAVE_KEY = 'epet_save_v4'; 
  
  function freshState() {
    return { 
      petType: null, petName: '小糯米',
      hunger: 85, mood: 85, energy: 85, clean: 85, 
      age: 0, 
      last: Date.now() 
    };
  }

  function loadState() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
    if (!s || typeof s.hunger !== 'number' || !s.petType) return freshState();

    const now = Date.now();
    const mins = Math.max(0, Math.min((now - (s.last || now)) / 60000, 720));
    s.age = (s.age || 0) + Math.floor(mins / 2); // 每2分钟长1岁
    
    for (const k of ['hunger', 'mood', 'energy', 'clean']) {
      s[k] = clamp((typeof s[k] === 'number' ? s[k] : 80) - 2.0 * mins);
    }
    s.last = now;
    return s;
  }

  let S = loadState();
  function saveState() {
    S.last = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* =========================================================
     年龄阶段判定
  ========================================================= */
  function getAgeStage() {
    if (S.age < 5) return 'baby';
    if (S.age < 15) return 'adult';
    return 'elder';
  }

  function getStageMultiplier() {
    const stage = getAgeStage();
    if (stage === 'baby') return { size: 0.75, decay: 1.5, jump: 1.3 };
    if (stage === 'elder') return { size: 1.15, decay: 0.8, jump: 0.6 };
    return { size: 1.0, decay: 1.0, jump: 1.0 };
  }

  /* =========================================================
     音效合成 (Web Audio API)
  ========================================================= */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSynthSound() {
    if (!S.petType) return;
    initAudio();
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    let freq = 800, type = 'sine';
    if (S.petType === 'cat') { freq = 1000; type = 'sine'; }
    if (S.petType === 'dog') { freq = 600; type = 'square'; }
    if (S.petType === 'pig') { freq = 300; type = 'sawtooth'; }

    const stage = getAgeStage();
    if (stage === 'baby') freq *= 1.5;
    if (stage === 'elder') freq *= 0.7;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, audioCtx.currentTime + 0.15);
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }

  /* =========================================================
     Canvas 初始化
  ========================================================= */
  const canvas = document.getElementById('pet');
  const ctx    = canvas.getContext('2d');
  const stage  = document.querySelector('.stage');

  let W = 0, H = 0, DPR = 1;
  let petHit = { x: 0, y: 0, r: 60 };

  function resize() {
    const r = stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* =========================================================
     动画状态与粒子
  ========================================================= */
  const anim = {
    bounce: 0, blinking: false, blinkT: 0, blinkNext: 1800,
    sleep: 0, lookX: 0, lookY: 0, lookTX: 0, lookTY: 0
  };
  const particles = [];

  function spawn(x, y, n, kind) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x + rand(-26, 26), y: y + rand(-16, 16),
        vx: rand(-0.045, 0.045), vy: rand(-0.17, -0.06),
        life: 0, max: rand(620, 1150), size: rand(5, 11),
        rot: rand(-0.7, 0.7), kind: kind || 'spark'
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 0.00026 * dt; p.rot += 0.0012 * dt;
    }
  }

  function heartPath(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.42);
    ctx.bezierCurveTo(x - s * 1.05, y - s * 0.42, x - s * 0.52, y - s * 1.18, x, y - s * 0.36);
    ctx.bezierCurveTo(x + s * 0.52, y - s * 1.18, x + s * 1.05, y - s * 0.42, x, y + s * 0.42);
    ctx.closePath();
  }

  function drawParticles() {
    for (const p of particles) {
      const k = p.life / p.max;
      const alpha = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
      ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);

      if (p.kind === 'heart') {
        ctx.fillStyle = '#ff7eb3'; heartPath(0, 0, p.size * 0.62); ctx.fill();
      } else if (p.kind === 'bubble_soap') {
        ctx.beginPath(); ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200, 230, 255, 0.6)'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      } else if (p.kind === 'bubble_gel') {
        ctx.beginPath(); ctx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 182, 193, 0.6)'; ctx.fill();
        ctx.strokeStyle = '#ffb6c1'; ctx.lineWidth = 1.5; ctx.stroke();
      } else if (p.kind === 'milk') {
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'bread') {
        ctx.fillStyle = '#d4a373'; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.35, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'noodle') {
        ctx.strokeStyle = '#f4a261'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.3, 0, Math.PI); ctx.stroke();
      } else if (p.kind === 'potato') {
        ctx.fillStyle = '#e9c46a'; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#a9f5d6'; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* =========================================================
     星空背景
  ========================================================= */
  const stars = [];
  for (let i = 0; i < 38; i++) {
    stars.push({ x: Math.random(), y: Math.random() * 0.72, r: rand(0.5, 1.6), ph: Math.random() * Math.PI * 2, sp: rand(0.4, 1.5) });
  }

  function drawStars(now) {
    for (const s of stars) {
      const a = 0.18 + 0.5 * (0.5 + 0.5 * Math.sin(now * 0.001 * s.sp + s.ph));
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(190,215,255,' + a.toFixed(3) + ')'; ctx.fill();
    }
  }

  /* =========================================================
     绘制工具
  ========================================================= */
  function drawEye(x, y, r, blink, happy) {
    if (happy && blink < 0.05) {
      ctx.beginPath(); ctx.arc(x, y + r * 0.62, r * 0.98, Math.PI * 1.14, Math.PI * 1.86);
      ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = Math.max(2, r * 0.36); ctx.lineCap = 'round'; ctx.stroke();
      return;
    }
    const ry = r * (1 - blink * 0.88);
    if (ry < 0.6) {
      ctx.beginPath(); ctx.arc(x, y - r * 0.3, r * 0.85, Math.PI * 0.15, Math.PI * 0.85);
      ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = Math.max(2, r * 0.32); ctx.lineCap = 'round'; ctx.stroke();
      return;
    }
    ctx.beginPath(); ctx.ellipse(x, y, r, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#2b3a36'; ctx.fill();
    if (blink < 0.4) {
      ctx.beginPath(); ctx.arc(x - r * 0.32, y - r * 0.34, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.2, y + r * 0.2, r * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
    }
  }

  /* =========================================================
     真实可爱的宠物绘制 (圆润、无海胆线条)
  ========================================================= */
  
  // 1. 小猫
  function drawCat(cx, cy, bw, bh, blink, happy) {
    const baseColor = '#fcf6f0'; 
    const stripeColor = '#e08a4b';
    const darkStripe = '#8c5a3a';
    const noseColor = '#ff9eb5';

    // 身体 (平滑圆润)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + bh * 0.15, bw * 1.1, bh * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = baseColor; ctx.fill();
    
    // 尾巴 (圆润带条纹)
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.9, cy + bh * 0.6);
    ctx.quadraticCurveTo(cx + bw * 1.6, cy + bh * 0.1, cx + bw * 1.2, cy - bh * 0.5);
    ctx.strokeStyle = stripeColor; ctx.lineWidth = bw * 0.16; ctx.lineCap = 'round'; ctx.stroke();
    // 尾巴条纹
    for(let i=0; i<3; i++){
        ctx.beginPath();
        ctx.arc(cx + bw*1.15 + i*0.15*bw, cy + bh*0.5 - i*0.3*bh, bw*0.08, 0, Math.PI*2);
        ctx.fillStyle = darkStripe; ctx.fill();
    }

    // 虎斑色块（用平滑椭圆叠加）
    ctx.beginPath();
    ctx.ellipse(cx - bw * 0.4, cy + bh * 0.2, bw * 0.4, bh * 0.5, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(224,138,75,0.35)'; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + bw * 0.3, cy - bh * 0.3, bw * 0.3, bh * 0.25, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140,90,58,0.25)'; ctx.fill();
    ctx.restore();

    // 耳朵 (平滑三角形带弧度)
    const earY = cy - bh * 0.75;
    const earW = bw * 0.5;
    const earH = bh * 0.55;
    // 左耳
    ctx.beginPath();
    ctx.moveTo(cx - bw * 0.4, earY + bh*0.1);
    ctx.quadraticCurveTo(cx - bw * 0.7, earY - earH, cx - bw * 0.15, earY - earH*0.7);
    ctx.quadraticCurveTo(cx - bw * 0.1, earY, cx - bw * 0.4, earY + bh*0.1);
    ctx.fillStyle = baseColor; ctx.fill();
    ctx.strokeStyle = stripeColor; ctx.lineWidth = 2.5; ctx.stroke();
    // 左耳内耳
    ctx.beginPath();
    ctx.moveTo(cx - bw * 0.35, earY + bh*0.05);
    ctx.quadraticCurveTo(cx - bw * 0.55, earY - earH*0.7, cx - bw * 0.2, earY - earH*0.5);
    ctx.quadraticCurveTo(cx - bw * 0.15, earY - bh*0.05, cx - bw * 0.35, earY + bh*0.05);
    ctx.fillStyle = 'rgba(255,150,175,0.4)'; ctx.fill();

    // 右耳
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.4, earY + bh*0.1);
    ctx.quadraticCurveTo(cx + bw * 0.7, earY - earH, cx + bw * 0.15, earY - earH*0.7);
    ctx.quadraticCurveTo(cx + bw * 0.1, earY, cx + bw * 0.4, earY + bh*0.1);
    ctx.fillStyle = baseColor; ctx.fill();
    ctx.strokeStyle = stripeColor; ctx.lineWidth = 2.5; ctx.stroke();
    // 右耳内耳
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.35, earY + bh*0.05);
    ctx.quadraticCurveTo(cx + bw * 0.55, earY - earH*0.7, cx + bw * 0.2, earY - earH*0.5);
    ctx.quadraticCurveTo(cx + bw * 0.15, earY - bh*0.05, cx + bw * 0.35, earY + bh*0.05);
    ctx.fillStyle = 'rgba(255,150,175,0.4)'; ctx.fill();

    // 眼睛
    const eyeY = cy - bh * 0.05;
    const eyeGap = bw * 0.35;
    const eyeR = bw * 0.12;
    drawEye(cx - eyeGap, eyeY, eyeR, blink, happy);
    drawEye(cx + eyeGap, eyeY, eyeR, blink, happy);

    // 鼻子和嘴巴
    const noseY = cy + bh * 0.2;
    ctx.beginPath(); // 鼻子
    ctx.moveTo(cx - bw * 0.08, noseY);
    ctx.lineTo(cx + bw * 0.08, noseY);
    ctx.lineTo(cx, noseY + bh * 0.05);
    ctx.closePath();
    ctx.fillStyle = noseColor; ctx.fill();
    
    ctx.beginPath(); // 嘴巴
    ctx.moveTo(cx, noseY + bh * 0.05);
    if (happy) {
      ctx.arc(cx - bw * 0.08, noseY + bh * 0.1, bw * 0.08, Math.PI * 1.5, Math.PI * 2);
      ctx.arc(cx + bw * 0.08, noseY + bh * 0.1, bw * 0.08, Math.PI, Math.PI * 1.5);
    } else {
      ctx.arc(cx - bw * 0.08, noseY + bh * 0.12, bw * 0.08, 0, Math.PI);
      ctx.arc(cx + bw * 0.08, noseY + bh * 0.12, bw * 0.08, 0, Math.PI);
    }
    ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = 2; ctx.stroke();

    // 胡须（干净利落）
    ctx.strokeStyle = 'rgba(100,100,100,0.4)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const wy = noseY + i * 5 - 5;
      ctx.beginPath(); ctx.moveTo(cx - bw * 0.15, wy); ctx.lineTo(cx - bw * 0.65, wy - 8 + i * 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + bw * 0.15, wy); ctx.lineTo(cx + bw * 0.65, wy - 8 + i * 5); ctx.stroke();
    }
  }

  // 2. 小狗 (垂耳)
  function drawDog(cx, cy, bw, bh, blink, happy) {
    const baseColor = '#fdfbf7'; const brownColor = '#b07d5b'; const darkBrown = '#7a4c33';
    
    // 身体
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy + bh * 0.15, bw * 1.1, bh * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = baseColor; ctx.fill();
    
    // 身体色块
    ctx.beginPath(); ctx.ellipse(cx - bw * 0.4, cy + bh * 0.3, bw * 0.4, bh * 0.5, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(176,125,91,0.4)'; ctx.fill();
    ctx.restore();

    // 垂耳（标志性）
    const earY = cy - bh * 0.5;
    const earH = bh * 0.9;
    // 左垂耳
    ctx.beginPath();
    ctx.moveTo(cx - bw * 0.5, earY);
    ctx.quadraticCurveTo(cx - bw * 1.1, earY + bh * 0.2, cx - bw * 0.8, earY + earH);
    ctx.quadraticCurveTo(cx - bw * 0.5, earY + earH * 0.5, cx - bw * 0.3, earY);
    ctx.fillStyle = brownColor; ctx.fill();
    // 右垂耳
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.5, earY);
    ctx.quadraticCurveTo(cx + bw * 1.1, earY + bh * 0.2, cx + bw * 0.8, earY + earH);
    ctx.quadraticCurveTo(cx + bw * 0.5, earY + earH * 0.5, cx + bw * 0.3, earY);
    ctx.fillStyle = brownColor; ctx.fill();

    // 额头白毛
    ctx.beginPath(); ctx.ellipse(cx, cy - bh * 0.35, bw * 0.25, bh * 0.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = baseColor; ctx.fill();

    // 眼睛
    const eyeY = cy - bh * 0.05;
    const eyeGap = bw * 0.35;
    const eyeR = bw * 0.12;
    drawEye(cx - eyeGap, eyeY, eyeR, blink, happy);
    drawEye(cx + eyeGap, eyeY, eyeR, blink, happy);

    // 大鼻子
    const noseY = cy + bh * 0.25;
    ctx.beginPath(); ctx.ellipse(cx, noseY, bw * 0.14, bh * 0.09, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#2b2b2b'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - bw * 0.04, noseY - bh * 0.03, bw * 0.04, bh * 0.02, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();

    // 嘴巴
    ctx.beginPath(); ctx.moveTo(cx, noseY + bh * 0.08);
    if (happy) {
      ctx.arc(cx - bw * 0.1, noseY + bh * 0.12, bw * 0.1, Math.PI * 1.5, Math.PI * 2);
      ctx.arc(cx + bw * 0.1, noseY + bh * 0.12, bw * 0.1, Math.PI, Math.PI * 1.5);
    } else {
      ctx.arc(cx - bw * 0.1, noseY + bh * 0.15, bw * 0.1, 0, Math.PI);
      ctx.arc(cx + bw * 0.1, noseY + bh * 0.15, bw * 0.1, 0, Math.PI);
    }
    ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = 2; ctx.stroke();
  }

  // 3. 小猪 (粉嫩)
  function drawPig(cx, cy, bw, bh, blink, happy) {
    const pinkBody = '#ffc0cb'; const darkPink = '#ff9eb5'; const nosePink = '#ff6b8b';

    // 身体
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy + bh * 0.15, bw * 1.15, bh * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = pinkBody; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy + bh * 0.3, bw * 0.7, bh * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill(); // 肚皮
    ctx.restore();

    // 耳朵
    const earY = cy - bh * 0.7;
    ctx.beginPath(); ctx.ellipse(cx - bw * 0.6, earY, bw * 0.25, bh * 0.2, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = darkPink; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - bw * 0.6, earY, bw * 0.12, bh * 0.1, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffb6c1'; ctx.fill();

    ctx.beginPath(); ctx.ellipse(cx + bw * 0.6, earY, bw * 0.25, bh * 0.2, 0.4, 0, Math.PI * 2);
    ctx.fillStyle = darkPink; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + bw * 0.6, earY, bw * 0.12, bh * 0.1, 0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffb6c1'; ctx.fill();

    // 眼睛
    const eyeY = cy - bh * 0.05;
    const eyeGap = bw * 0.38;
    const eyeR = bw * 0.1;
    if (blink > 0.5) {
      ctx.beginPath(); ctx.arc(cx - eyeGap, eyeY - eyeR * 0.3, eyeR * 0.8, Math.PI * 0.15, Math.PI * 0.85); ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + eyeGap, eyeY - eyeR * 0.3, eyeR * 0.8, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx - eyeGap, eyeY, eyeR, 0, Math.PI * 2); ctx.fillStyle = '#2b2b2b'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx - eyeGap - eyeR*0.3, eyeY - eyeR*0.3, eyeR*0.35, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + eyeGap, eyeY, eyeR, 0, Math.PI * 2); ctx.fillStyle = '#2b2b2b'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + eyeGap - eyeR*0.3, eyeY - eyeR*0.3, eyeR*0.35, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    }

    // 猪鼻子
    const noseY = cy + bh * 0.25;
    ctx.beginPath(); ctx.ellipse(cx, noseY, bw * 0.22, bh * 0.15, 0, 0, Math.PI * 2);
    ctx.fillStyle = nosePink; ctx.fill();
    ctx.strokeStyle = '#e04a6a'; ctx.lineWidth = 2; ctx.stroke();
    // 鼻孔
    ctx.beginPath(); ctx.ellipse(cx - bw * 0.09, noseY, bw * 0.04, bh * 0.06, 0, 0, Math.PI * 2); ctx.fillStyle = '#c23a5a'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + bw * 0.09, noseY, bw * 0.04, bh * 0.06, 0, 0, Math.PI * 2); ctx.fillStyle = '#c23a5a'; ctx.fill();

    // 嘴巴
    ctx.beginPath();
    if (happy) { ctx.arc(cx, noseY + bh * 0.12, bw * 0.08, Math.PI * 1.2, Math.PI * 1.8); }
    else { ctx.arc(cx, noseY + bh * 0.15, bw * 0.08, 0.2, Math.PI - 0.2); }
    ctx.strokeStyle = '#2b3a36'; ctx.lineWidth = 2; ctx.stroke();

    // 腮红
    ctx.fillStyle = 'rgba(255,100,130,0.3)';
    ctx.beginPath(); ctx.ellipse(cx - eyeGap - bw*0.15, eyeY + bh * 0.15, bw * 0.15, bh * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + eyeGap + bw*0.15, eyeY + bh * 0.15, bw * 0.15, bh * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  }

  /* =========================================================
     主渲染
  ========================================================= */
  function render(now) {
    if (!W || !H || !S.petType) return;
    ctx.clearRect(0, 0, W, H);
    drawStars(now);

    const cx = W / 2;
    const groundY = H * 0.84;
    const stageMult = getStageMultiplier();
    const bw = Math.min(W * 0.29, H * 0.24) * stageMult.size;
    const bh = bw * 1.06;

    const p = 1 - anim.bounce;
    const jump = -Math.sin(p * Math.PI) * bh * 0.52 * stageMult.jump;
    const bob = Math.sin(now * 0.0016) * bh * 0.028;
    const cy = groundY - bh + bob + jump;

    petHit = { x: cx, y: cy, r: bw * 1.25 };

    const sad = S.mood < 35 || S.hunger < 22 || S.energy < 18;
    const happy = S.mood > 62 && !sad;

    const sk = 1 - Math.sin(p * Math.PI) * 0.5;
    ctx.beginPath(); ctx.ellipse(cx, groundY + bh * 0.05, bw * 0.88 * sk, bw * 0.17 * sk, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fill();

    let blink = 0;
    if (anim.blinking) { const q = anim.blinkT / 190; blink = q < 0.5 ? q * 2 : (1 - q) * 2; }
    if (anim.sleep > 0) blink = 1;

    if (S.petType === 'cat') drawCat(cx, cy, bw, bh, blink, happy);
    else if (S.petType === 'dog') drawDog(cx, cy, bw, bh, blink, happy);
    else if (S.petType === 'pig') drawPig(cx, cy, bw, bh, blink, happy);

    if (anim.sleep > 0) {
      const k = 1 - anim.sleep / 2200;
      ctx.save(); ctx.globalAlpha = Math.min(1, anim.sleep / 500) * 0.9;
      ctx.fillStyle = '#bcd7ff'; ctx.textAlign = 'center';
      const zx = cx + bw * 0.9; const zy = cy - bh * 0.85 - k * bh * 0.45;
      ctx.font = '600 ' + Math.max(15, bw * 0.32) + 'px -apple-system,sans-serif'; ctx.fillText('z', zx, zy);
      ctx.font = '600 ' + Math.max(11, bw * 0.22) + 'px -apple-system,sans-serif'; ctx.fillText('z', zx + bw * 0.34, zy - bh * 0.32);
      ctx.restore();
    }
    drawParticles();
  }

  /* =========================================================
     逻辑更新
  ========================================================= */
  function update(dt) {
    const m = dt / 60000;
    const stageMult = getStageMultiplier();
    
    S.age += (dt / 60000) / 2; // 每2分钟增长1岁

    S.hunger = clamp(S.hunger - 2.0 * stageMult.decay * m);
    S.mood   = clamp(S.mood   - 1.5 * stageMult.decay * m);
    S.energy = clamp(S.energy - 1.0 * stageMult.decay * m);
    S.clean  = clamp(S.clean  - 1.2 * stageMult.decay * m);

    if (anim.bounce > 0) anim.bounce = Math.max(0, anim.bounce - dt / 520);
    anim.blinkNext -= dt;
    if (!anim.blinking && anim.blinkNext <= 0) { anim.blinking = true; anim.blinkT = 0; anim.blinkNext = rand(2200, 5200); }
    if (anim.blinking) { anim.blinkT += dt; if (anim.blinkT > 190) { anim.blinking = false; anim.blinkT = 0; } }
    if (anim.sleep > 0) anim.sleep = Math.max(0, anim.sleep - dt);

    const k = Math.min(1, dt / 130);
    anim.lookX += (anim.lookTX - anim.lookX) * k;
    anim.lookY += (anim.lookTY - anim.lookY) * k;
    updateParticles(dt);
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(now - lastTime, 80);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     UI 与 交互
  ========================================================= */
  const STAT_DEFS = [
    { key: 'hunger', icon: '🍚', color: '#ffb454' },
    { key: 'mood',   icon: '💖', color: '#ff7eb3' },
    { key: 'energy', icon: '⚡', color: '#6ec9ff' },
    { key: 'clean',  icon: '🫧', color: '#6ee7b7' }
  ];

  const statsEl = document.getElementById('stats');
  const moodTag = document.getElementById('moodTag');
  const toastEl = document.getElementById('toast');
  const headerName = document.getElementById('headerName');
  const ageDisplay = document.getElementById('ageDisplay');
  const startScreen = document.getElementById('startScreen');
  const petOptions = document.querySelectorAll('.pet-card');
  const nameInput = document.getElementById('petNameInput');
  const startBtn = document.getElementById('startBtn');
  const actionMenu = document.getElementById('actionMenu');
  const menuTitle = document.getElementById('menuTitle');
  const menuGrid = document.getElementById('menuGrid');
  const menuClose = document.getElementById('menuClose');
  
  const fills = {}, vals = {};

  STAT_DEFS.forEach(d => {
    const row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML = '<span class="ico">' + d.icon + '</span><div class="track"><div class="fill"></div></div><span class="val">--</span>';
    statsEl.appendChild(row);
    fills[d.key] = row.querySelector('.fill'); vals[d.key] = row.querySelector('.val');
  });

  function refreshUI() {
    ageDisplay.textContent = Math.floor(S.age) + ' 岁';
    STAT_DEFS.forEach(d => {
      const v = S[d.key];
      fills[d.key].style.width = v + '%';
      fills[d.key].style.background = v < 25 ? '#ff5f6d' : d.color;
      vals[d.key].textContent = Math.round(v);
    });

    const avg = (S.hunger + S.mood + S.energy + S.clean) / 4;
    let txt = '开心', cls = '';
    if (S.energy < 20) { txt = '困了…'; cls = 'warn'; }
    else if (S.hunger < 25) { txt = '好饿…'; cls = 'warn'; }
    else if (S.clean < 25) { txt = '脏兮兮'; cls = 'warn'; }
    else if (S.mood < 35) { txt = '不开心'; cls = 'bad'; }
    else if (avg > 75) { txt = '超幸福'; cls = ''; }
    else if (avg > 50) { txt = '还不错'; cls = ''; }
    moodTag.textContent = txt;
    moodTag.className = 'mood-tag ' + cls;
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  /* ---- 选择界面逻辑 ---- */
  let selectedType = null;
  petOptions.forEach(card => {
    card.addEventListener('click', () => {
      petOptions.forEach(c => c.classList.remove('active'));
      card.classList.add('active'); selectedType = card.dataset.type; checkStartReady();
    });
  });
  nameInput.addEventListener('input', checkStartReady);
  function checkStartReady() {
    if (selectedType && nameInput.value.trim().length > 0) startBtn.classList.add('ready');
    else startBtn.classList.remove('ready');
  }

  startBtn.addEventListener('click', () => {
    if (!selectedType || !nameInput.value.trim()) return;
    S.petType = selectedType; S.petName = nameInput.value.trim();
    S.age = 0; 
    saveState();
    headerName.textContent = S.petName;
    startScreen.classList.add('hidden');
    toast('欢迎 ' + S.petName + ' 来到新家！');
    refreshUI(); resize();
    initAudio();
  });

  /* ---- 互动菜单逻辑 ---- */
  let currentMenuType = ''; // 'feed' or 'clean'

  function openMenu(type) {
    currentMenuType = type;
    menuGrid.innerHTML = '';
    
    if (type === 'feed') {
      menuTitle.textContent = '选择食物';
      const foods = [
        { id: 'milk', label: '牛奶', emoji: '🥛', hunger: 10, mood: 5, clean: -1, particle: 'milk' },
        { id: 'bread', label: '面包', emoji: '🍞', hunger: 20, mood: 3, clean: -2, particle: 'bread' },
        { id: 'noodle', label: '泡面', emoji: '🍜', hunger: 30, mood: -2, clean: -5, particle: 'noodle' },
        { id: 'potato', label: '洋芋粑', emoji: '🥔', hunger: 25, mood: 8, clean: -3, particle: 'potato' }
      ];
      foods.forEach(food => {
        const btn = document.createElement('div');
        btn.className = 'menu-item';
        btn.innerHTML = `<span class="item-emoji">${food.emoji}</span><span class="item-label">${food.label}</span>`;
        btn.addEventListener('click', () => {
          actionMenu.classList.remove('show');
          executeFeed(food);
        });
        menuGrid.appendChild(btn);
      });
    } else if (type === 'clean') {
      menuTitle.textContent = '选择洗浴用品';
      const tools = [
        { id: 'soap', label: '香皂', emoji: '🧼', clean: 30, mood: -5, particle: 'bubble_soap' },
        { id: 'gel', label: '沐浴露', emoji: '🧴', clean: 40, mood: 10, particle: 'bubble_gel' }
      ];
      tools.forEach(tool => {
        const btn = document.createElement('div');
        btn.className = 'menu-item';
        btn.innerHTML = `<span class="item-emoji">${tool.emoji}</span><span class="item-label">${tool.label}</span>`;
        btn.addEventListener('click', () => {
          actionMenu.classList.remove('show');
          executeClean(tool);
        });
        menuGrid.appendChild(btn);
      });
    }
    actionMenu.classList.add('show');
  }

  menuClose.addEventListener('click', () => actionMenu.classList.remove('show'));

  /* ---- 具体执行动作 ---- */
  function executeFeed(food) {
    const cx = W / 2, cy = H * 0.6;
    anim.bounce = 1; playSynthSound(); // 触发声音
    spawn(cx, cy, 8, food.particle);
    
    const stage = getAgeStage();
    let feedMsg = `吃掉了${food.label}`;
    if (stage === 'baby') feedMsg = `狼吞虎咽地吃掉了${food.label}`;
    else if (stage === 'elder') feedMsg = `细嚼慢咽地吃掉了${food.label}`;
    
    S.hunger = clamp(S.hunger + food.hunger);
    S.mood = clamp(S.mood + food.mood);
    S.clean = clamp(S.clean + food.clean);
    
    toast(feedMsg + ` 饱食+${food.hunger}`);
    refreshUI(); saveState();
  }

  function executeClean(tool) {
    const cx = W / 2, cy = H * 0.6;
    anim.bounce = 1; playSynthSound(); // 触发声音
    spawn(cx, cy, 12, tool.particle);
    
    S.clean = clamp(S.clean + tool.clean);
    S.mood = clamp(S.mood + tool.mood);
    
    let msg = `使用了${tool.label}`;
    if (tool.mood > 0) msg += `，香香的！`;
    else msg += `，有点刺鼻…`;
    
    toast(msg + ` 清洁+${tool.clean}`);
    refreshUI(); saveState();
  }

  /* ---- 绑定按钮 ---- */
  document.querySelectorAll('.act').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      const act = btn.dataset.act;
      const cx = W / 2, cy = H * 0.6;
      
      if (act === 'feed' || act === 'clean') {
        openMenu(act);
        return; // 弹出菜单后不直接执行，等待用户选择
      }

      anim.bounce = 1; playSynthSound(); // 其他动作直接触发
      
      if (act === 'play') {
        if (S.energy < 15) { S.mood = clamp(S.mood - 3); toast('😵 太累了，先睡一会儿吧…'); return; }
        S.mood = clamp(S.mood + 22); S.energy = clamp(S.energy - 12); S.hunger = clamp(S.hunger - 8);
        spawn(cx, cy, 9, 'heart');
        toast('🎾 玩得好开心 +22');
      } else if (act === 'sleep') {
        const sleepEnergy = getAgeStage() === 'baby' ? 40 : (getAgeStage() === 'elder' ? 25 : 35);
        S.energy = clamp(S.energy + sleepEnergy); S.mood = clamp(S.mood + 3);
        anim.sleep = 2200; spawn(cx, cy, 5, 'spark');
        toast('💤 呼…呼… +' + sleepEnergy + ' 精力');
      }
      
      refreshUI(); saveState();
      if (navigator.vibrate) navigator.vibrate(12);
    });
  });

  /* ---- 摸一摸 ---- */
  canvas.addEventListener('pointerdown', e => {
    if (!S.petType) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const dx = x - petHit.x, dy = y - petHit.y;
    if (dx * dx + dy * dy <= petHit.r * petHit.r) {
      anim.bounce = 1; S.mood = clamp(S.mood + 2);
      spawn(petHit.x, petHit.y - petHit.r * 0.4, 5, 'heart');
      playSynthSound();
      refreshUI(); saveState();
      if (navigator.vibrate) navigator.vibrate(8);
    }
  });

  stage.addEventListener('pointermove', e => {
    if (!S.petType) return;
    const r = canvas.getBoundingClientRect();
    if (!W || !H) return;
    anim.lookTX = clamp(((e.clientX - r.left) / W - 0.5) * 2, -1, 1);
    anim.lookTY = clamp(((e.clientY - r.top) / H - 0.5) * 2, -1, 1);
  });
  stage.addEventListener('pointerleave', () => { anim.lookTX = 0; anim.lookTY = 0; });

  /* =========================================================
     启动逻辑
  ========================================================= */
  function init() {
    if (S.petType) {
      startScreen.classList.add('hidden');
      headerName.textContent = S.petName;
    } else {
      headerName.textContent = '等待领养...';
    }
    refreshUI();
  }

  resize(); setTimeout(resize, 60); init();
  setInterval(() => { refreshUI(); }, 260);
  setInterval(saveState, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
  window.addEventListener('pagehide', saveState);
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
