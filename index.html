<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>我的电子小宠物</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0b0e1a;color:#e8eeff;
    display:flex;justify-content:center;align-items:stretch;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  .app{
    position:relative;width:100%;max-width:480px;height:100dvh;height:100vh;
    display:flex;flex-direction:column;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    gap:10px;
    background:radial-gradient(130% 70% at 50% -10%,#2c3e6b 0%,#1a2140 42%,#0d1020 100%);
  }
  @media (min-width:600px){
    body{align-items:center;background:#080a12}
    .app{height:min(860px,94dvh);border-radius:30px;overflow:hidden;
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.02) inset;}
  }

  /* ---------- 顶部 ---------- */
  .header{display:flex;align-items:center;gap:9px;padding:2px 4px;flex:none}
  .avatar{
    width:9px;height:9px;border-radius:50%;
    background:#6ee7b7;box-shadow:0 0 10px #6ee7b7;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .pet-name{font-size:17px;font-weight:600;letter-spacing:.4px}
  .mood-tag{
    font-size:11px;padding:3px 10px;border-radius:999px;margin-left:auto;
    background:rgba(125,211,252,.14);color:#7dd3fc;
    border:1px solid rgba(125,211,252,.28);
    transition:all .35s;
  }
  .mood-tag.warn{background:rgba(255,180,84,.14);color:#ffb454;border-color:rgba(255,180,84,.3)}
  .mood-tag.bad{background:rgba(255,95,109,.15);color:#ff8b96;border-color:rgba(255,95,109,.3)}

  /* ---------- 舞台 ---------- */
  .stage{position:relative;flex:1;min-height:0}
  #pet{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

  .toast{
    position:absolute;left:50%;top:14%;
    transform:translate(-50%,-8px);
    padding:7px 15px;border-radius:999px;font-size:13px;
    background:rgba(18,26,48,.9);border:1px solid rgba(255,255,255,.15);
    color:#dbe6ff;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .25s,transform .25s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:5;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 面板 ---------- */
  .panel{
    flex:none;display:flex;flex-direction:column;gap:13px;
    padding:14px;border-radius:22px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}
  .stat{display:flex;align-items:center;gap:7px}
  .stat .ico{font-size:14px;width:17px;text-align:center;flex:none;line-height:1}
  .track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;
    transition:width .5s cubic-bezier(.2,.9,.3,1),background .4s}
  .stat .val{width:24px;text-align:right;font-size:11px;color:#93a1c4;
    font-variant-numeric:tabular-nums;flex:none}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .act{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:11px 4px;border-radius:16px;font-family:inherit;font-size:12px;
    color:#e8eeff;cursor:pointer;
    border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    transition:transform .12s,background .2s,box-shadow .2s;
  }
  .act:active{transform:scale(.93);background:rgba(255,255,255,.18)}
  .act .emoji{font-size:20px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
  .act:nth-child(1):active{box-shadow:0 0 20px rgba(255,180,84,.35)}
  .act:nth-child(2):active{box-shadow:0 0 20px rgba(255,126,179,.35)}
  .act:nth-child(3):active{box-shadow:0 0 20px rgba(110,201,255,.35)}
  .act:nth-child(4):active{box-shadow:0 0 20px rgba(167,139,250,.35)}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <span class="avatar"></span>
    <span class="pet-name">小糯米</span>
    <span class="mood-tag" id="moodTag">开心</span>
  </div>

  <div class="stage">
    <canvas id="pet"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="act" data-act="feed"><span class="emoji">🍎</span>喂食</button>
      <button class="act" data-act="play"><span class="emoji">🎾</span>玩耍</button>
      <button class="act" data-act="clean"><span class="emoji">🛁</span>洗澡</button>
      <button class="act" data-act="sleep"><span class="emoji">💤</span>睡觉</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     工具
  ========================================================= */
  const clamp = (v, a = 0, b = 100) => (v < a ? a : v > b ? b : v);
  const rand  = (a, b) => a + Math.random() * (b - a);

  /* =========================================================
     存档 / 状态
  ========================================================= */
  const SAVE_KEY = 'epet_save_v1';
  const DECAY = { hunger: 2.0, mood: 1.5, energy: 1.0, clean: 1.2 }; // 每分钟衰减

  function freshState() {
    return { hunger: 85, mood: 85, energy: 85, clean: 85, last: Date.now() };
  }

  function loadState() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
    if (!s || typeof s.hunger !== 'number') return freshState();

    const now = Date.now();
    const mins = Math.max(0, Math.min((now - (s.last || now)) / 60000, 720)); // 最多补算 12 小时
    for (const k in DECAY) s[k] = clamp((typeof s[k] === 'number' ? s[k] : 80) - DECAY[k] * mins);
    s.last = now;
    return s;
  }

  let S = loadState();

  function saveState() {
    S.last = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* =========================================================
     Canvas 初始化
  ========================================================= */
  const canvas = document.getElementById('pet');
  const ctx    = canvas.getContext('2d');
  const stage  = document.querySelector('.stage');

  let W = 0, H = 0, DPR = 1;
  let petHit = { x: 0, y: 0, r: 60 };

  function resize() {
    const r = stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width;
    H = r.height;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* =========================================================
     动画状态
  ========================================================= */
  const anim = {
    bounce: 0,          // 1 -> 0 跳跃进度
    blinking: false,
    blinkT: 0,
    blinkNext: 1800,
    sleep: 0,           // >0 显示 zzz
    lookX: 0, lookY: 0,
    lookTX: 0, lookTY: 0
  };

  /* =========================================================
     粒子
  ========================================================= */
  const particles = [];

  function spawn(x, y, n, kind) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x + rand(-26, 26),
        y: y + rand(-16, 16),
        vx: rand(-0.045, 0.045),
        vy: rand(-0.17, -0.06),
        life: 0,
        max: rand(620, 1150),
        size: rand(5, 11),
        rot: rand(-0.7, 0.7),
        kind: kind || 'spark'
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.00026 * dt;
      p.rot += 0.0012 * dt;
    }
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.42);
    ctx.bezierCurveTo(x - s * 1.05, y - s * 0.42, x - s * 0.52, y - s * 1.18, x, y - s * 0.36);
    ctx.bezierCurveTo(x + s * 0.52, y - s * 1.18, x + s * 1.05, y - s * 0.42, x, y + s * 0.42);
    ctx.closePath();
  }

  function drawParticles() {
    for (const p of particles) {
      const k = p.life / p.max;
      const alpha = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);

      if (p.kind === 'heart') {
        ctx.fillStyle = '#ff7eb3';
        heartPath(0, 0, p.size * 0.62);
        ctx.fill();
      } else if (p.kind === 'bubble') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = '#8fd8ff';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-p.size * 0.18, -p.size * 0.18, p.size * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.fill();
      } else if (p.kind === 'food') {
        ctx.fillStyle = '#ffb454';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#a9f5d6';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  /* =========================================================
     星空背景
  ========================================================= */
  const stars = [];
  for (let i = 0; i < 38; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.72,
      r: rand(0.5, 1.6),
      ph: Math.random() * Math.PI * 2,
      sp: rand(0.4, 1.5)
    });
  }

  function drawStars(now) {
    for (const s of stars) {
      const a = 0.18 + 0.5 * (0.5 + 0.5 * Math.sin(now * 0.001 * s.sp + s.ph));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(190,215,255,' + a.toFixed(3) + ')';
      ctx.fill();
    }
  }

  /* =========================================================
     绘制：耳朵 / 眼睛
  ========================================================= */
  function drawEar(x, y, w, h, rot, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.quadraticCurveTo(-w * 0.44, -h * 0.84, 0, -h);
    ctx.quadraticCurveTo(w * 0.44, -h * 0.84, w / 2, 0);
    ctx.quadraticCurveTo(0, h * 0.3, -w / 2, 0);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = Math.max(2, w * 0.09);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.stroke();

    // 内耳
    ctx.beginPath();
    ctx.moveTo(-w * 0.26, -h * 0.08);
    ctx.quadraticCurveTo(-w * 0.2, -h * 0.62, 0, -h * 0.72);
    ctx.quadraticCurveTo(w * 0.2, -h * 0.62, w * 0.26, -h * 0.08);
    ctx.quadraticCurveTo(0, h * 0.06, -w * 0.26, -h * 0.08);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,150,175,.35)';
    ctx.fill();
    ctx.restore();
  }

  function drawEye(x, y, r, blink, happy) {
    // 开心时画 ^ ^
    if (happy && blink < 0.05) {
      ctx.beginPath();
      ctx.arc(x, y + r * 0.62, r * 0.98, Math.PI * 1.14, Math.PI * 1.86);
      ctx.strokeStyle = '#2b3a36';
      ctx.lineWidth = Math.max(2, r * 0.36);
      ctx.lineCap = 'round';
      ctx.stroke();
      return;
    }

    const ry = r * (1 - blink * 0.88);
    if (ry < 0.6) {
      // 完全闭眼：一条弧线
      ctx.beginPath();
      ctx.arc(x, y - r * 0.3, r * 0.85, Math.PI * 0.15, Math.PI * 0.85);
      ctx.strokeStyle = '#2b3a36';
      ctx.lineWidth = Math.max(2, r * 0.32);
      ctx.lineCap = 'round';
      ctx.stroke();
      return;
    }

    ctx.beginPath();
    ctx.ellipse(x, y, r, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#2b3a36';
    ctx.fill();

    if (blink < 0.4) {
      ctx.beginPath();
      ctx.arc(x - r * 0.32, y - r * 0.34, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
    }
  }

  /* =========================================================
     主渲染
  ========================================================= */
  function render(now) {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);

    drawStars(now);

    /* ---- 尺寸与位置 ---- */
    const cx      = W / 2;
    const groundY = H * 0.84;
    const bw      = Math.min(W * 0.29, H * 0.24);   // 半宽
    const bh      = bw * 1.06;                      // 半高

    const p     = 1 - anim.bounce;
    const jump  = -Math.sin(p * Math.PI) * bh * 0.52;
    const bob   = Math.sin(now * 0.0016) * bh * 0.028;
    const cy    = groundY - bh + bob + jump;

    petHit = { x: cx, y: cy, r: bw * 1.25 };

    /* ---- 心情判定 ---- */
    const sad      = S.mood < 35 || S.hunger < 22 || S.energy < 18;
    const happy    = S.mood > 62 && !sad;
    const hue      = sad ? 205 : 158;
    const sat      = sad ? 38 : 58;
    const lit      = sad ? 64 : 68;

    const topC    = 'hsl(' + hue + ',' + sat + '%,' + (lit + 15) + '%)';
    const midC    = 'hsl(' + hue + ',' + sat + '%,' + lit + '%)';
    const botC    = 'hsl(' + hue + ',' + (sat + 6) + '%,' + (lit - 22) + '%)';
    const earC    = 'hsl(' + hue + ',' + sat + '%,' + (lit - 2) + '%)';
    const strokeC = 'hsl(' + hue + ',' + (sat - 16) + '%,' + (lit - 40) + '%)';

    /* ---- 影子 ---- */
    const sk = 1 - Math.sin(p * Math.PI) * 0.5;
    ctx.beginPath();
    ctx.ellipse(cx, groundY + bh * 0.05, bw * 0.88 * sk, bw * 0.17 * sk, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.fill();

    /* ---- 耳朵 ---- */
    const earW = bw * 0.54, earH = bh * 0.64;
    const earY = cy - bh * 0.76;
    drawEar(cx - bw * 0.56, earY, earW, earH, -0.34, earC, strokeC);
    drawEar(cx + bw * 0.56, earY, earW, earH,  0.34, earC, strokeC);

    /* ---- 身体 ---- */
    ctx.save();
    ctx.shadowColor = 'hsla(' + hue + ',80%,60%,.55)';
    ctx.shadowBlur  = bw * 0.7;

    ctx.beginPath();
    ctx.moveTo(cx - bw, cy + bh * 0.1);
    ctx.quadraticCurveTo(cx - bw * 1.06, cy - bh * 0.96, cx, cy - bh);
    ctx.quadraticCurveTo(cx + bw * 1.06, cy - bh * 0.96, cx + bw, cy + bh * 0.1);
    ctx.quadraticCurveTo(cx + bw * 0.96, cy + bh * 1.06, cx, cy + bh);
    ctx.quadraticCurveTo(cx - bw * 0.96, cy + bh * 1.06, cx - bw, cy + bh * 0.1);
    ctx.closePath();

    const bg = ctx.createLinearGradient(cx - bw, cy - bh, cx + bw * 0.5, cy + bh);
    bg.addColorStop(0, topC);
    bg.addColorStop(0.55, midC);
    bg.addColorStop(1, botC);
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur  = 0;
    ctx.lineWidth   = Math.max(2.5, bw * 0.036);
    ctx.lineJoin    = 'round';
    ctx.strokeStyle = strokeC;
    ctx.stroke();
    ctx.restore();

    /* ---- 高光 ---- */
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(cx - bw * 0.4, cy - bh * 0.46, bw * 0.22, bh * 0.14, -0.55, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    /* ---- 面部 ---- */
    const eyeY  = cy - bh * 0.16;
    const eyeGap = bw * 0.42;
    const eyeR  = bw * 0.14;

    let blink = 0;
    if (anim.blinking) {
      const q = anim.blinkT / 190;
      blink = q < 0.5 ? q * 2 : (1 - q) * 2;
    }
    if (anim.sleep > 0) blink = 1;

    const lx = anim.lookX * bw * 0.07;
    const ly = anim.lookY * bh * 0.05;

    drawEye(cx - eyeGap + lx, eyeY + ly, eyeR, blink, happy);
    drawEye(cx + eyeGap + lx, eyeY + ly, eyeR, blink, happy);

    /* 腮红 */
    ctx.fillStyle = 'hsla(345,90%,72%,' + (sad ? 0.16 : 0.42) + ')';
    ctx.beginPath();
    ctx.ellipse(cx - eyeGap - bw * 0.13, eyeY + bh * 0.18, bw * 0.17, bh * 0.095, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + eyeGap + bw * 0.13, eyeY + bh * 0.18, bw * 0.17, bh * 0.095, 0, 0, Math.PI * 2);
    ctx.fill();

    /* 嘴巴 */
    const mouthY = cy + bh * 0.13;
    ctx.beginPath();
    if (sad) {
      ctx.arc(cx, mouthY + bh * 0.09, bw * 0.16, Math.PI * 1.18, Math.PI * 1.82);
    } else {
      ctx.arc(cx, mouthY - bh * 0.02, bw * 0.15, Math.PI * 0.18, Math.PI * 0.82);
    }
    ctx.strokeStyle = strokeC;
    ctx.lineWidth = Math.max(2, bw * 0.032);
    ctx.lineCap = 'round';
    ctx.stroke();

    /* ---- 睡觉 Zzz ---- */
    if (anim.sleep > 0) {
      const k = 1 - anim.sleep / 2200;
      ctx.save();
      ctx.globalAlpha = Math.min(1, anim.sleep / 500) * 0.9;
      ctx.fillStyle = '#bcd7ff';
      ctx.textAlign = 'center';
      const zx = cx + bw * 0.9;
      const zy = cy - bh * 0.85 - k * bh * 0.45;
      ctx.font = '600 ' + Math.max(15, bw * 0.32) + 'px -apple-system,sans-serif';
      ctx.fillText('z', zx, zy);
      ctx.font = '600 ' + Math.max(11, bw * 0.22) + 'px -apple-system,sans-serif';
      ctx.fillText('z', zx + bw * 0.34, zy - bh * 0.32);
      ctx.restore();
    }

    /* ---- 粒子 ---- */
    drawParticles();
  }

  /* =========================================================
     逻辑更新
  ========================================================= */
  function update(dt) {
    const m = dt / 60000; // 分钟

    S.hunger = clamp(S.hunger - DECAY.hunger * m);
    S.mood   = clamp(S.mood   - DECAY.mood   * m);
    S.energy = clamp(S.energy - DECAY.energy * m);
    S.clean  = clamp(S.clean  - DECAY.clean  * m);

    // 跳跃衰减
    if (anim.bounce > 0) anim.bounce = Math.max(0, anim.bounce - dt / 520);

    // 眨眼
    anim.blinkNext -= dt;
    if (!anim.blinking && anim.blinkNext <= 0) {
      anim.blinking = true;
      anim.blinkT = 0;
      anim.blinkNext = rand(2200, 5200);
    }
    if (anim.blinking) {
      anim.blinkT += dt;
      if (anim.blinkT > 190) { anim.blinking = false; anim.blinkT = 0; }
    }

    // 睡觉计时
    if (anim.sleep > 0) anim.sleep = Math.max(0, anim.sleep - dt);

    // 视线平滑
    const k = Math.min(1, dt / 130);
    anim.lookX += (anim.lookTX - anim.lookX) * k;
    anim.lookY += (anim.lookTY - anim.lookY) * k;

    updateParticles(dt);
  }

  /* =========================================================
     主循环
  ========================================================= */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(now - lastTime, 80);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     UI
  ========================================================= */
  const STAT_DEFS = [
    { key: 'hunger', icon: '🍚', color: '#ffb454' },
    { key: 'mood',   icon: '💖', color: '#ff7eb3' },
    { key: 'energy', icon: '⚡', color: '#6ec9ff' },
    { key: 'clean',  icon: '🫧', color: '#6ee7b7' }
  ];

  const statsEl  = document.getElementById('stats');
  const moodTag  = document.getElementById('moodTag');
  const toastEl  = document.getElementById('toast');
  const fills = {}, vals = {};

  STAT_DEFS.forEach(d => {
    const row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML =
      '<span class="ico">' + d.icon + '</span>' +
      '<div class="track"><div class="fill"></div></div>' +
      '<span class="val">--</span>';
    statsEl.appendChild(row);
    fills[d.key] = row.querySelector('.fill');
    vals[d.key]  = row.querySelector('.val');
  });

  function refreshUI() {
    STAT_DEFS.forEach(d => {
      const v = S[d.key];
      fills[d.key].style.width = v + '%';
      fills[d.key].style.background = v < 25 ? '#ff5f6d' : d.color;
      vals[d.key].textContent = Math.round(v);
    });

    const avg = (S.hunger + S.mood + S.energy + S.clean) / 4;
    let txt = '开心', cls = '';
    if (S.energy < 20)            { txt = '困了…';  cls = 'warn'; }
    else if (S.hunger < 25)       { txt = '好饿…';  cls = 'warn'; }
    else if (S.clean < 25)        { txt = '脏兮兮';  cls = 'warn'; }
    else if (S.mood < 35)         { txt = '不开心';  cls = 'bad'; }
    else if (avg > 75)            { txt = '超幸福';  cls = ''; }
    else if (avg > 50)            { txt = '还不错';  cls = ''; }

    moodTag.textContent = txt;
    moodTag.className = 'mood-tag ' + cls;
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  /* =========================================================
     互动动作
  ========================================================= */
  function doAction(act) {
    const cx = W / 2, cy = H * 0.6;
    anim.bounce = 1;

    switch (act) {
      case 'feed':
        if (S.hunger > 96) { toast('小糯米已经吃饱啦～'); break; }
        S.hunger = clamp(S.hunger + 22);
        S.mood   = clamp(S.mood + 4);
        S.clean  = clamp(S.clean - 3);
        spawn(cx, cy, 8, 'food');
        toast('🍎 吃得津津有味 +22');
        break;

      case 'play':
        if (S.energy < 15) {
          S.mood = clamp(S.mood - 3);
          toast('😵 太累了，先睡一会儿吧…');
          break;
        }
        S.mood   = clamp(S.mood + 22);
        S.energy = clamp(S.energy - 12);
        S.hunger = clamp(S.hunger - 8);
        spawn(cx, cy, 9, 'heart');
        toast('🎾 玩得好开心 +22');
        break;

      case 'clean':
        if (S.clean > 96) { toast('已经很干净啦～'); break; }
        S.clean = clamp(S.clean + 32);
        S.mood  = clamp(S.mood + 6);
        spawn(cx, cy, 10, 'bubble');
        toast('🫧 香喷喷 +32');
        break;

      case 'sleep':
        S.energy = clamp(S.energy + 35);
        S.mood   = clamp(S.mood + 3);
        anim.sleep = 2200;
        spawn(cx, cy, 5, 'spark');
        toast('💤 呼…呼… +35 精力');
        break;
    }

    refreshUI();
    saveState();
  }

  document.querySelectorAll('.act').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      doAction(btn.dataset.act);
      if (navigator.vibrate) navigator.vibrate(12);
    });
  });

  /* ---- 摸一摸 ---- */
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    const dx = x - petHit.x, dy = y - petHit.y;
    if (dx * dx + dy * dy <= petHit.r * petHit.r) {
      anim.bounce = 1;
      S.mood = clamp(S.mood + 2);
      spawn(petHit.x, petHit.y - petHit.r * 0.4, 5, 'heart');
      refreshUI();
      saveState();
      if (navigator.vibrate) navigator.vibrate(8);
    }
  });

  /* ---- 视线跟随 ---- */
  stage.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    if (!W || !H) return;
    anim.lookTX = clamp(((e.clientX - r.left) / W - 0.5) * 2, -1, 1);
    anim.lookTY = clamp(((e.clientY - r.top) / H - 0.5) * 2, -1, 1);
  });

  stage.addEventListener('pointerleave', () => {
    anim.lookTX = 0;
    anim.lookTY = 0;
  });

  /* =========================================================
     启动
  ========================================================= */
  resize();
  setTimeout(resize, 60);
  refreshUI();

  setInterval(() => {
    refreshUI();
  }, 260);

  setInterval(saveState, 5000);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveState();
  });
  window.addEventListener('pagehide', saveState);

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
